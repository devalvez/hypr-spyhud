# SPYHUNTER look — add to hyprland.conf (hyprlang syntax)
# Load the plugin first:  plugin = /caminho/para/spyhud.so   (or: hyprpm enable spyhud)

general {
    gaps_in = 10
    gaps_out = 18
    border_size = 2
    col.active_border   = rgba(5a5e64ff)   # cinza claro (moldura)
    col.inactive_border = rgba(26282bff)   # cinza escuro
    layout = dwindle
}

decoration {
    rounding = 0                           # painéis retos, sem cantos arredondados

    # "placa" deslocada atrás da janela (efeito de painéis empilhados da imagem)
    shadow {
        enabled = true
        range = 0
        render_power = 1
        offset = 6 6
        color = rgba(0e0f10cc)
    }

    blur { enabled = false }
    active_opacity   = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = true
    animation = windows, 1, 3, default, popin 90%
}

plugin {
    spyhud {
        enabled = true
        bar_height = 22
        text_size = 9
        font = JetBrains Mono
        bracket_length = 14
        bracket_thickness = 2
        ticks = true
        leds = true
        show_close = true

        col.panel          = rgba(34373bff)
        col.panel_inactive = rgba(2a2c2fff)
        col.line           = rgba(5a5e64ff)
        col.accent         = rgba(f2c400ff)   # amarelo
        col.dim            = rgba(6b6f75ff)
        col.text           = rgba(d8dadcff)
    }
}
